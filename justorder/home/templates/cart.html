{% extends 'layout.html' %}

{% block content %}
<div class="container mt-5">
    <h2 class="text-center mb-4">Your Cart</h2>
    <table class="table">
        <thead>
            <tr>
                <th>Item Name</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Total</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for item in cart %}
            <tr>
                <td>{{ item.name }}</td>
                <td>${{ item.price }}</td>
                <td>{{ item.quantity }}</td>
                <td>${{ item.total }}</td>
                <td>
                    <a href="{% url 'update_cart' item.name 'increase' %}" class="btn btn-sm btn-success">+</a>
                    <a href="{% url 'update_cart' item.name 'decrease' %}" class="btn btn-sm btn-warning">-</a>
                    <a href="{% url 'remove_from_cart' item.name %}" class="btn btn-sm btn-danger">Remove</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <h4 class="text-end">Total Price: ${{ total_price }}</h4>
    <div class="text-end mt-4">
        <a href="{% url 'payment_page' %}" class="btn btn-primary">Checkout</a>
    </div>
</div>
{% endblock %}
